<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Solmate">
  <title>Solmate</title>
  <!-- The mark on its own ground, so it holds against a light or a dark tab
       bar. Drawn a touch heavier than the logo: at 16px, hairlines vanish. -->
  <defs>
    <linearGradient id="icon-lit" x1="22" y1="8" x2="11" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD070"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="icon-disc">
      <circle cx="16" cy="16" r="7.4"/>
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="#0C1420"/>

  <g transform="translate(-2.74 3.3)">
    <path
      d="M10.32 7.89L8.43 5.19M16.65 6.12L16.86 2.83M22.69 8.70L24.92 6.27M25.78 14.49L29.05 13.99M24.57 20.95L27.43 22.60"
      stroke="#FFC24D" stroke-width="2.4" stroke-linecap="round" fill="none"/>

    <circle cx="16" cy="16" r="7.4" fill="url(#icon-lit)"/>

    <g clip-path="url(#icon-disc)">
      <rect x="-24" y="17" width="80" height="44" fill="#3D5F92" transform="rotate(42 16 16)"/>
    </g>
  </g>
</svg>
